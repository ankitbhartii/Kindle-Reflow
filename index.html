<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport: allow user scaling on desktop but lock on mobile for app feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ══ PWA / Mobile App ══════════════════════════════════════════════════ -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="K-Reflow" />
    <meta name="msapplication-TileColor" content="#D2E823" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Splash screen color for iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ══ SEO ═══════════════════════════════════════════════════════════════ -->
    <meta name="description" content="Kindle-Reflow — Neo-Brutalist PDF reader. Reflows any PDF into a fluid, responsive Kindle-style book. 100% private, offline-capable, installable on Android." />
    <meta name="keywords" content="PDF reader, kindle, reflow, ebook, offline, PWA, android" />
    <meta property="og:title" content="Kindle-Reflow — Reflowable PDF Reader" />
    <meta property="og:description" content="Transform any PDF into a fluid, Kindle-style book. 100% client-side, installable on Android." />
    <meta property="og:image" content="/preview.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Kindle-Reflow — PDF E-Reader</title>

    <!-- ══ Fonts ═════════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Charter:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,300..800;1,7..72,300..800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- ══ Safe-area inset fix for notches ═══════════════════════════════════ -->
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      html, body { margin: 0; padding: 0; }
      #root {
        padding-top: var(--sat);
        padding-left: var(--sal);
        padding-right: var(--sar);
      }
    </style>
  </head>
  <body class="bg-[#F8F4E8] text-[#09090B] antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
